[build-system]
requires = ["hatchling", "hatch-cython"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython", "numpy"]


[tool.hatch.build.targets.wheel.hooks.cython.options]
compile_py = false


[tool.hatch.build.targets.wheel.hooks.cython.options.platform.windows]
extra_compile_args = ["/openmp"]
extra_link_args = ["/openmp"]

[tool.hatch.build.targets.wheel.hooks.cython.options.platform.linux]
extra_compile_args = ["-fopenmp"]
extra_link_args = ["-fopenmp"]

[tool.hatch.build.targets.wheel.hooks.cython.options.platform.darwin]
extra_compile_args = ["-Xpreprocessor", "-fopenmp"]
extra_link_args = ["-lomp"]


[project]
name = "adsorpy"
#dynamic = ["version"]  # The Python guide says that this will use the Git tag to fill it in.
version = "1.3.2-alpha.1"  # Edit manually.
description = "Random sequential adsorption (RSA) simulation, 2D lattice-based."
authors = [{ name = "J.F.W. Maas", email = "j.f.w.maas@tue.nl" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E.md"]
classifiers = [
    # Project maturity:
    "Development Status :: 5 - Production/Stable",
#    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    # Intended users of project:
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    # Supported Python versions:
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # This does not run on mobile because of Shapely.
    "Operating System :: OS Independent",
]
keywords = [
    "RSA",
    "random sequential adsorption",
    "adsorption",
    "surface science",
    "Monte Carlo",
    "lattice model",
    "statistical mechanics",
    "packing",
    "jamming",
    "molecular adsorption",
    "coverage",
    "computational chemistry",
    "computational physics",
    "stochastic simulation",
    "gap size distribution"
]

dependencies = [
    "numpy>=2.2.6",
#    "numba>=0.67.0",
    "matplotlib>=3.10.9",
    "shapely>=2.1.2",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "rtree>=1.4.1",
    "svg-py>=1.10.0",
    "defusedxml>=0.7.1",
    "PySide6>=6.11.1",
    "typing-extensions>=4.16.0",
    # Everything after this line is included so uv also runs with the lowest dependency resolution.
    "html5lib>=1.1",
    "wcwidth>=0.7.0",
    "webencodings>=0.5.1",
    "pyproject-hooks>=1.0.0",
    "beautifulsoup4>=4.10.0",
    "entrypoints>=0.2.3",
    "future>=1.0.0",
    "secretstorage>=3.5.0",
    "pywin32-ctypes>=0.2.3",
    "pycparser>=3.0.0",
    "enum34>=1.1.10",
    "ipaddress>=1.0.23",
    "ply>=3.11",
]


[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.5",
    "scipy>=1.15.3",
    "codecov>=2.1.13",
    "pytest-qt>=4.5.0",
    "adsorpy[gui-deps]",
    "pytest-xvfb>=3.1.1; sys_platform == 'linux'",
    "pyvirtualdisplay>=1.3; sys_platform == 'linux'",
    "easyprocess>=1.1; sys_platform == 'linux'",
]
lint = [
    "mypy==2.3.1",
    "ruff==0.16.4",
    "basedpyright==1.39.10",
    "tach==0.35.0",
    "slotscheck==0.20.1",
    "pyside6-stubs==6.7.3.0",
    "gitpython>=3.1.59",
]
docs = [
    "sphinx>=8.1.3",
    "furo>=2025.12.19",
    "sphinx_design>=0.6.1",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-pyproject>=0.3.0",
]
envs = [
    "tox==4.60.0",
    "tox-uv==1.36.0",
    "uv==0.12.5",
]
dev-misc = [
    "build>=1.5.0",
    "twine>=6.0",
    "cryptography>=50.0.0",
    "check-wheel-contents>=0.6.3",
    "pre-commit>=4.6.2",
    "nodeenv>=1.10.0",
    "cibuildwheel>=2.23.4",
]
gui-deps = [
    "pandas>=2.3.3",
    "h5py>=3.16.0",
    "seaborn>=0.13.2",
    "dask[distributed]>=2026.7.1",
]
dev-complete = [
    "adsorpy[test,lint,docs,envs,dev-misc,gui-deps]"
]


[project.urls]
github = "https://github.com/JoostFWMaas/AdsorPy"
Documentation = "https://joostfwmaas.github.io/AdsorPy"
Changelog = "https://github.com/JoostFWMaas/AdsorPy/blob/main/CHANGELOG.md"
homepage = "https://pypi.org/project/adsorpy/"
issues = "https://github.com/JoostFWMaas/AdsorPy/issues"
download = "https://pypi.org/project/adsorpy/#files"


[tool.hatch.package_data]
"adsorpy" = ["py.typed"]


[tool.hatch.build]
deterministic = true


[tool.hatch.build.targets.wheel]
sbom-files = ["sbom.cdx.json"]
packages = ["src/adsorpy"]


[tool.hatch.build.targets.sdist]
include = [
    "/src/adsorpy",
    "/pyproject.toml",
    "README.md",
    "/LICENSE",
    "sbom.cdx.json",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--cov=adsorpy", "--cov-report=term", "--cov-report=html", "--strict-markers", "--import-mode=importlib"]
qt_api = "pyside6"


[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/Output/*",
    "*/__main__.py",
    "*/__init__.py",
    "*/molecule_lib*.py", # There is no point in testing the individual molecules.
    "*/rsa_config.py", # Cannot be tested properly. Will be reworked.
    "*/sensitivity.py", # Demonstrator, not included.
    "*/Scripts/*",
]


[tool.coverage.report]
#fail_under = 20
exclude_also = [
    "if __name__ == .__main__.:",
    "def main()",
#    "if False:",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
    "def plot_",
    "if print_",
    "if plot_",
    "while temp_results_folder.is_dir()", # Checks for collision in saving folders. Nothing is saved for tests.
    "if self.flux_flag:", # Experimental feature, not yet usable.
    "_run_flux_", # See above.
    "if not self.simple_shape_flag", # Idem ditto.
    "if (sys\\.)?version_info", # Is tested with Tox (between instances of Pytest). False negative.
    "from datetime import", # Used for compatibility between versions. Only tests for one version at a time.
    "@njit", # Compiled code is not seen by coverage. This code is tested with Hypothesis though. False negative.
    "svg",
    "css",
    "def show_",
    "def save_",
    "from typing",
    "if prlongoutput_flag",
    "batch_simulation",
]


[tool.coverage.paths]
source = [
    "src/",  # Local path
    ".tox/*lib//site-packages/",  # Tox path
]


[tool.mypy]
mypy_path = ["."]
ignore_missing_imports = true
strict = true
disallow_any_explicit = true
#disallow_any_decorated = true  # Throws an error because geo.Polygon in a tuple is turned into Any for the @staticmethod.
#warn_unreachable = true  # Set this to true when pushing to main?
exclude = ['/Scripts']
plugins = ["pydantic.mypy"]


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
disallow_subclassing_any = false


[tool.flake8]
max-line-length = 120
exclude = [
    ".venv",
    "venv",
    "tests",
    "Lib",
]
count = true


[tool.isort]
src_paths = ["src"]
line_length = 88
multi_line_output = 3
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
include_trailing_comma = true
#remove_unused_imports = true
skip = [".json", ".venv", ".tox"]
known_first_party = ["RandomSequentialAdsorption"]
known_local_folder = ["molcule_lib", "RSA_Calculator", "rsa_config"]


[tool.black]
line-length = 88


#[tool.uv]
#required-version = "0.12.5"


[tool.ruff]
line-length = 120
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
src = ["src"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ruff.lint]
select = ['ALL']
pylint.max-args = 11
pylint.max-branches = 20
pylint.max-statements = 80
mccabe.max-complexity = 20
future-annotations = true  # Future annotations enabled.

ignore = [
    "ERA001",
    "TD",
    "T201",
    "FIX", # This is for me to fix over several versions. These functions are never used unless they are fixed.
    "DTZ003", # The datetime warning or  utcnow()
    "FBT001", # Disallows booleans in functions. (I can see its use case, but no.)
    "FBT002", # Disallows booleans default arguments in functions.
    "ARG002", # Unused method argument.
    "ARG001", # Unused function argument.
    "D203", # Conflicts with D211: no blank line before class.
    "D213", # Conflicts with D212: multi-line summary first line.
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]  # Missing docstring in public package. Not needed, package is empty.
"tests/*" = ["S101", "TC", "SLF001"]  # Assert should not be used in production code! But this is test code, so here it is expected.


[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["pydantic.dataclasses.dataclass"]


[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
#typeCheckingMode = "strict"  # Comment when using basedpyright.
#useLibraryCodeForTypes = true

# Avoid penalising third-party libraries.
reportMissingTypeStubs = "none"

# Suppress "partially unknown" noise from deps like numpy, shapely, matplotlib, etc...
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnnecessaryCast = "none"  # These are needed for mypy.
reportUnnecessaryIsInstance = "none"  # These are needed for mypy.

# Keep useful strict checks.
reportImplicitOverride = "error"
reportPrivateUsage = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnnecessaryComparison = "warning"  # These are usually included to prevent the user from breaking things.

# Basedpyright options, comment these out when falling back on pyright:
typeCheckingMode = "strict"  # Comment when using pyright.  Options (increasingly strict): "strict", "recommended", "all".
failOnWarnings = false  # basedpyright by default allows warnings on check but fails warnings on CI. That is inconsistent behaviour, so this disables that.
executionEnvironments = [{ root = "tests", reportPrivateUsage = "none", reportUnnecessaryTypeIgnoreComment = "none" }]


[tool.slotscheck]
strict-imports = true


[tool.pyside6-deploy]
# Basic application configuration overrides
title = "AdsorPy"
input_file = "gui.py"
#icon = "assets/something_something.ico"
exec_directory = "build"
project_dir = "./src/adsorpy"


[tool.cibuildwheel]
build-frontend = "build[uv]"
