repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-ast
  - id: pretty-format-json
  - id: check-json
  - id: check-toml
  - id: check-yaml
  - id: name-tests-test
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.6
  hooks:
  - id: uv-lock
