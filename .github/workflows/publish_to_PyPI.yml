name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

env:
  PACKAGE_NAME: adsorpy

jobs:
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      match: ${{ steps.semver.outputs.match }}
    steps:
     - name: Checkout repository
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
         fetch-depth: 0

     - name: regex semver tag check
       id: semver
       run: |
        set -euo pipefail
        REF="${GITHUB_REF_NAME}"
        if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?(\+.+)?$ ]]; then
          echo "match=true" >> $GITHUB_OUTPUT
        else
          echo "match=false" >> $GITHUB_OUTPUT
        fi

  # =========================================================================
  # 1. MATRIX COMPILATION: Builds binary wheel variations
  # =========================================================================
  build_wheels:
    needs: tag-check
    if: needs.tag-check.outputs.match == 'true'
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build wheels via cibuildwheel
        run: uvx cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: "universal2"
          SOURCE_DATE_EPOCH: "0"
          PYTHONHASHSEED: "0"

      - name: Upload OS-specific wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cython-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # =========================================================================
  # 2. SOURCE & AGGREGATION: Collects wheels, generates sdist, runs validations
  # =========================================================================
  build:
    needs: [tag-check, build_wheels]
    name: build + reproducible artifacts
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    permissions:
      contents: read
      id-token: write

    env:
      SOURCE_DATE_EPOCH: "0"
      PYTHONHASHSEED: "0"
      UV_FROZEN: "1"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}

      - name: Generate SBOM
        uses: sbomify/sbomify-action@ddf6a0d3d75b645153ad1ad60034b3fe2cb1eb63 # v26.7.0
        env:
          LOCK_FILE: uv.lock
          OUTPUT_FILE: sbom.cdx.json
          UPLOAD: true
          COMPONENT_NAME: ${{ env.PACKAGE_NAME }}
          COMPONENT_VERSION: ${{ github.ref_name }}-gha${{github.run_number}}
          ENRICH: true
          AUGMENT: true

      - name: Install build and validation tools
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev-misc --no-default-groups

      - name: Create working dist directory
        run: mkdir dist

      - name: Download Linux wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cython-wheels-ubuntu-latest
          path: dist

      - name: Download Windows wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cython-wheels-windows-latest
          path: dist

      - name: Download macOS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cython-wheels-macos-latest
          path: dist

      # We assert deterministic reproducibility explicitly on the sdist target
      - name: Build sdist #1
        run: |
          set -euo pipefail
          mkdir sdist1 sdist2
          uv run python -m build --sdist --outdir sdist1

      - name: Build sdist #2 (candidate reproducible)
        run: |
          set -euo pipefail
          uv run python -m build --sdist --outdir sdist2

      - name: Compare builds
        run: |
          set -euo pipefail
          rm -rf reproducibility
          mkdir reproducibility
          sha256sum sdist1/*.tar.gz | awk '{print $1}' > reproducibility/hashes1.txt
          sha256sum sdist2/*.tar.gz | awk '{print $1}' > reproducibility/hashes2.txt
          diff reproducibility/hashes1.txt reproducibility/hashes2.txt
          echo "Reproducible sdist build OK"

      - name: Promote sdist to main dist archive
        run: |
          set -euo pipefail
          mv sdist2/*.tar.gz dist/

      - name: Generate hashes.txt
        run: |
          set -euo pipefail
          sha256sum dist/*.whl dist/*.tar.gz > hashes.txt

      # -------------------------------
      # VALIDATION ON AGGREGATED BUNDLE
      # -------------------------------
      - name: Twine check
        run: |
          set -euo pipefail
          uv run python -m twine check dist/*

      - name: Check wheel contents
        run: |
          set -euo pipefail
          uv tool run check-wheel-contents dist/*.whl

      - name: Smoke test (wheel)
        run: |
          set -euo pipefail
          uv run --no-project pip install dist/*.whl
          uv run --no-project python -c "import ${{ env.PACKAGE_NAME }}; print(${{ env.PACKAGE_NAME }}.__version__)"

      - name: Smoke test (sdist)
        run: |
          set -euo pipefail
          uv run --no-project pip install dist/*.tar.gz
          uv run --no-project python -c "import ${{ env.PACKAGE_NAME }}; print(${{ env.PACKAGE_NAME }}.__version__)"

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          python - <<EOF
          import re
          import sys
          from packaging.version import Version
          import ${{ env.PACKAGE_NAME }}

          expected_raw = "${GITHUB_REF_NAME}"
          actual = Version(${{ env.PACKAGE_NAME }}.__version__)
          expected = re.sub(r"^v", "", expected_raw)
          expected = expected.replace("-alpha.", "a").replace("-beta.", "b").replace("-rc.", "rc")
          expected = re.sub(r"\+.*$", "", expected)
          expected = Version(expected)

          if actual != expected:
              print(f"Version mismatch: {actual} != {expected} (from {expected_raw})")
              sys.exit(1)
          print(f"Version OK: {actual}")
          EOF

      - name: Generate base64 subject hashes
        id: hash
        run: |
          set -euo pipefail
          HASHES=$(sha256sum dist/*.whl dist/*.tar.gz | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            hashes.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  # =========================================================================
  # 3. SIGNING: Crypto signatures using publish_to_PyPI.yml matching identity
  # =========================================================================
  sign:
    name: sign reproducible artifacts + SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: .

      - name: List artifacts
        run: |
          echo "Files:"
          find . -maxdepth 2 -type f

      - name: Sign SBOM (Sigstore)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: sbom.cdx.json
          staging: false
          verify: true
          verify-cert-identity: https://github.com{{ github.repository }}/.github/workflows/publish_to_PyPI.yml@${{ github.ref }}
          verify-oidc-issuer: https://githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Sign artifacts (Sigstore)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz hashes.txt
          staging: false
          verify: true
          verify-cert-identity: https://github.com{{ github.repository }}/.github/workflows/publish_to_PyPI.yml@${{ github.ref }}
          verify-oidc-issuer: https://githubusercontent.com
          upload-signing-artifacts: false
          release-signing-artifacts: false

      - name: Upload signed artifacts + SBOM bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-dist
          path: |
            dist/**
            hashes.txt*
            sbom.cdx.json*

  # =========================================================================
  # 4. PROVENANCE: Generates Level 3 SLSA compliance metadata
  # =========================================================================
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
      compile-generator: true

  # =========================================================================
  # 5. STAGING DEPLOYMENT: Submits targets to TestPyPI
  # =========================================================================
  publish-testpypi:
    name: publish to TestPyPI
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Show hashes (pre-publish verification)
        run: cat hashes.txt

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://pypi.org
          print-hash: true
          attestations: true

  # =========================================================================
  # 6. INTEGRATION LIVE TEST: Installs and verifies straight from TestPyPI simple indices
  # =========================================================================
  verify-install:
    name: verify install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Normalize version
        id: normalize_version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION/-alpha./a}"
          VERSION="${VERSION/-beta./b}"
          VERSION="${VERSION/-rc./rc}"
          VERSION=$(echo "$VERSION" | sed 's/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install from TestPyPI
        run: |
          set -euo pipefail
          uv run --no-project pip install \
            --index-url https://pypi.org \
            --extra-index-url https://pypi.org \
            ${{ env.PACKAGE_NAME }}==${{ steps.normalize_version.outputs.version }}
          uv run --no-project python -c "import ${{ env.PACKAGE_NAME }}; print(${{ env.PACKAGE_NAME }}.__version__)"

      - name: Verify import outside project tree
        run: |
          set -euo pipefail
          mkdir /tmp/testimport
          cd /tmp/testimport
          uv run --no-project python -c "import ${{ env.PACKAGE_NAME }}; print('Import OK')"

  # =========================================================================
  # 7. PRODUCTION DEPLOYMENT: Pushes definitive distributions to live PyPI registry
  # =========================================================================
  publish:
    name: publish to PyPI
    needs: verify-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-dist
          path: .

      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Verify hashes before publish
        run: |
          set -euo pipefail
          sha256sum -c hashes.txt

      - name: Remove Sigstore files before publish
        run: rm -f dist/*.sigstore.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  # =========================================================================
  # 8. POST-RELEASE IMMUTABILITY: Generates final release notes & bundles tags on GitHub
  # =========================================================================
  create-release:
    name: create immutable GitHub release
    needs: [publish, sign, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-dist
          path: signed/

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir release-assets
          cp dist/* release-assets/
          cp signed/* release-assets/ || true

      - name: Create GitHub Release (immutable)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
