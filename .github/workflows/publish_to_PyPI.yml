name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}
#  contents: read
#  id-token: write
#  security-events: write

env:
  PACKAGE_NAME: adsorpy

jobs:
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      match: ${{ steps.semver.outputs.match }}
    steps:
     - name: Checkout repository
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
         fetch-depth: 0

     - name: regex semver tag check
       id: semver
       run: |
        set -euo pipefail
        REF="${GITHUB_REF_NAME}"
        if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?(\+.+)?$ ]]; then
          echo "match=true" >> $GITHUB_OUTPUT
        else
          echo "match=false" >> $GITHUB_OUTPUT
        fi

  # =========================================================================
  # 1. MATRIX COMPILATION: Builds binary wheel variations
  # =========================================================================
  build_wheels:
    needs: tag-check
    if: needs.tag-check.outputs.match == 'true'
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-26.04-arm
          - os: windows-intel
            runs-on: windows-latest
            msvc_arch: x64
          - os: windows-arm
            runs-on: windows-11-arm
            msvc_arch: arm64
          - os: macos-intel
            # macos-15-intel is the last x86_64 runner
            runs-on: macos-15-intel
          - os: macos-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
#          - os: pyodide
#            runs-on: ubuntu-latest
#            platform: pyodide

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache cibuildwheel assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.os == 'windows-intel' && 'AMD64' || 'auto' }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache

      - name: Upload OS-specific wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cython-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # =========================================================================
  # 2. SOURCE & AGGREGATION: Collects wheels, generates sdist, runs validations
  # =========================================================================
  build:
    needs: [tag-check, build_wheels]
    name: build + reproducible artifacts
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    permissions:
      contents: read
      id-token: write      # Required for native OIDC token generation
      attestations: write  # Required for generating native GitHub Attestations

    env:
      SOURCE_DATE_EPOCH: "315532800"
      PYTHONHASHSEED: "0"
      UV_FROZEN: "1"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sbomify-cache
          key: sbomify-${{ runner.os }}

      - name: Generate SBOM
        uses: sbomify/sbomify-action@fc7f05256cca65c26c8010da5faf3203e9477e5c # v26.9.0
        env:
          LOCK_FILE: uv.lock
          OUTPUT_FILE: sbom.cdx.json
          UPLOAD: true
          COMPONENT_ID: "fnTHXhhCGZKB"
          COMPONENT_NAME: ${{ env.PACKAGE_NAME }}
          COMPONENT_VERSION: ${{ github.ref_name }}
          ENRICH: true
          AUGMENT: true
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache
          SYFT_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache/syft
          PRODUCT_RELEASE: '["jmtLHQbIeZLD:${{ github.ref_name }}"]'
          NORMALIZE_VERSION: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Standalone SBOM Document (For sbomify)
        id: sign_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'sbom.cdx.json'

      - name: Install build and validation tools
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev-misc --no-default-groups

      - name: Create working dist directory
        run: mkdir dist

      - name: Download all compiled matrix wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cython-wheels-*
          path: dist
          merge-multiple: true

      - name: Inject populated SBOM into wheels
        run: |
          set -euo pipefail
          for whl in dist/*.whl; do
            echo "Processing $whl..."
            dist_info_dir=$(unzip -Z1 "$whl" | grep '\.dist-info' | head -n 1 | sed -E 's|^([^/\\]+\.dist-info).*|\1/|')
            staging_path="tmp_stage/${dist_info_dir}sboms"
            mkdir -p "$staging_path"
            cp sbom.cdx.json "$staging_path/"
            (cd tmp_stage && zip -g "../$whl" "${dist_info_dir}sboms/sbom.cdx.json")
            rm -rf tmp_stage/
          done

      - name: Build sdist #1
        run: |
          set -euo pipefail
          mkdir sdist1 sdist2
          uv build --sdist --out-dir sdist1

      - name: Build sdist #2 (candidate reproducible)
        run: |
          set -euo pipefail
          uv build --sdist --out-dir sdist2

      - name: Compare builds
        run: |
          set -euo pipefail
          mkdir -p reproducibility

          (cd sdist1 && sha256sum *.tar.gz) > reproducibility/hashes1.txt
          (cd sdist2 && sha256sum *.tar.gz) > reproducibility/hashes2.txt

          diff reproducibility/hashes1.txt reproducibility/hashes2.txt
          echo "✨ Reproducible sdist build OK!"

      - name: Promote sdist to main dist archive
        run: |
          set -euo pipefail
          mv sdist2/*.tar.gz dist/

      # ---------------------------------------------------------------------
      # VALIDATION ON PURE ARTIFACTS
      # ---------------------------------------------------------------------
      - name: Twine check
        run: |
          set -euo pipefail
          uv run python -m twine check dist/*

      - name: Check wheel contents
        run: |
          set -euo pipefail
          uv tool run check-wheel-contents dist/*.whl


      - name: Smoke test (sdist across all target Python versions)
        run: |
          set -euo pipefail
          TARGET_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          SDIST_FILE=$(find dist -maxdepth 1 -name "*.tar.gz" | head -n 1)
          if [ -z "$SDIST_FILE" ]; then
            echo "❌ Error: Source distribution (.tar.gz) not found in dist/"
            exit 1
          fi
          for py_ver in "${TARGET_VERSIONS[@]}"; do
            echo "=========================================================="
            echo " Testing Source Distribution (sdist) for Python $py_ver"
            echo "=========================================================="

            sdist_env_dir="venv_sdist_${py_ver//./_}"
            uv venv "$sdist_env_dir" --python "$py_ver"
            uv pip install --python "$sdist_env_dir" --force-reinstall "$SDIST_FILE"

            uv run --no-project --python "$sdist_env_dir" python -c "import adsorpy; print('Successfully verified sdist version:', adsorpy.__version__)"
          done

      - name: Verify version matches tag
        run: |
          set -euo pipefail

          venv_sdist_3_13/bin/python - <<EOF
          import re
          import sys
          from packaging.version import Version
          import adsorpy

          expected_raw = "${GITHUB_REF_NAME}"

          # Cleanse and parse the tag string from GitHub Actions
          expected_clean = re.sub(r"^v", "", expected_raw)
          expected_clean = expected_clean.replace("-alpha.", "a").replace("-beta.", "b").replace("-rc.", "rc")
          expected_clean = re.sub(r"\+.*$", "", expected_clean)
          expected = Version(expected_clean)

          # Extract the actual version and dynamically drop any local build metadata suffix
          actual_raw = adsorpy.__version__
          actual_clean = re.sub(r"\+.*$", "", actual_raw)
          actual = Version(actual_clean)

          # Perform the apples-to-apples comparison
          if actual != expected:
              print(f"❌ Version mismatch! Environment code: {actual} (raw: {actual_raw}) | Target Tag: {expected} (parsed from {expected_raw})")
              sys.exit(1)

          print(f"✅ Version Match Success: {actual_raw} matches release tracking boundaries!")
          EOF

      # ---------------------------------------------------------------------
      # CRYPTOGRAPHIC TRANSCRIPT HASHES & ATTESTATION BUNDLE GENERATION
      # ---------------------------------------------------------------------
      - name: Generate base64 subject hashes
        id: hash
        run: |
          set -euo pipefail
          cd dist
          HASHES=$(sha256sum *.whl *.tar.gz | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          cd ..

      - name: Generate native GitHub Attestation
        id: sign_artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
          sbom-path: 'sbom.cdx.json'

      - name: Generate final SHA256SUMS
        run: |
          set -euo pipefail

          # Safely extract the absolute generated signature bundle path out of the step's outputs
          ARTIFACT_BUNDLE="${{ steps.sign_artifacts.outputs.bundle-path }}"
          SBOM_BUNDLE="${{ steps.sign_sbom.outputs.bundle-path }}"

          if [ -z "$ARTIFACT_BUNDLE" ] || [ -z "$SBOM_BUNDLE" ]; then
            echo "❌ Error: One of the attestation bundle paths is blank."
            exit 1
          fi

          echo "Successfully identified Sigstore signature package at: $ARTIFACT_BUNDLE"

          # Copy the file directly into the dist folder for deployment packaging
          mkdir -p attestations
          cp "$ARTIFACT_BUNDLE" attestations/adsorpy-artifacts.intoto.jsonl
          cp "$SBOM_BUNDLE" attestations/sbom.cdx.json.intoto.jsonl
          cp sbom.cdx.json attestations/

          # Generate the final verified release hashes manifest file
          cd dist
          sha256sum *.whl *.tar.gz > ../SHA256SUMS
          cd ../attestations
          sha256sum * >> ../SHA256SUMS
          cd ..

      # ---------------------------------------------------------------------
      # UPLOAD STAGING ENVIRONMENT ARTIFACTS
      # ---------------------------------------------------------------------
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-packages
          path: dist/

      - name: Upload checksum manifest file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: SHA256SUMS

      - name: Upload SBOM and attestations to github
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-metadata
          path: attestations/

      - name: Fetch dynamic SBOM ID
        id: fetch_id
        env:
          COMPONENT_ID: "fnTHXhhCGZKB"
          SBOMIFY_TOKEN: ${{ secrets.SBOMIFY_TOKEN }}  # Note to self: will expire in 90 days.
        run: |
          set -euo pipefail

          RESPONSE=$(curl -s -X 'GET' \
            "https://app.sbomify.com/api/v2/components/$COMPONENT_ID/sboms?page=1&page_size=1&include_all_types=false" \
            -H 'accept: application/json' \
            -H "Authorization: Bearer $SBOMIFY_TOKEN"

          SBOM_ID=$(echo "$RESPONSE" | jq -r '.items[0].sbom.id')
          echo "component_id=$SBOM_ID" >> "$GITHUB_OUTPUT"

      - name: Upload Provenance to sbomify
        env:
          ARTIFACT_ID: ${{ steps.fetch_id.outputs.component_id }}
          SBOMIFY_TOKEN: ${{ secrets.SBOMIFY_TOKEN }}  # Note to self: will expire in 90 days.
        run: |
          set -euo pipefail

          curl -X POST "https://app.sbomify.com/api/v2/artifacts/$ARTIFACT_ID/provenance" \
              -H "Authorization: Bearer $SBOMIFY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @attestations/sbom.cdx.json.intoto.jsonl


  # =========================================================================
  # 3. STAGING DEPLOYMENT: Submits targets to TestPyPI
  # =========================================================================
  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/adsorpy
    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-packages
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: .


      - name: Show hashes (pre-publish verification)
        run: cat SHA256SUMS

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          attestations: true

  # =========================================================================
  # 4. INTEGRATION LIVE TEST: Installs and verifies straight from TestPyPI simple indices
  # =========================================================================
  verify-install:
    name: verify install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Normalize version
        id: normalize_version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION/-alpha./a}"
          VERSION="${VERSION/-beta./b}"
          VERSION="${VERSION/-rc./rc}"
          VERSION=$(echo "$VERSION" | sed 's/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install from TestPyPI
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_seconds: 120
          retry_wait_seconds: 60
          command: |
            set -euo pipefail
            uv run \
              --index-strategy unsafe-best-match \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --with "${{ env.PACKAGE_NAME }}==${{ steps.normalize_version.outputs.version }}" \
            python -c "import ${{ env.PACKAGE_NAME }}; print(${{ env.PACKAGE_NAME }}.__version__)"

  # =========================================================================
  # 5. PRODUCTION DEPLOYMENT: Pushes definitive distributions to live PyPI registry
  # =========================================================================
  publish:
    name: publish to PyPI
    needs: verify-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adsorpy
    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-packages
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: .

      - name: Verify hashes before publish
        run: |
          set -euo pipefail
          cd dist
          grep -E '\.(whl|tar\.gz)$' ../SHA256SUMS | sha256sum -c -
          cd ..

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  # =========================================================================
  # 6. POST-RELEASE IMMUTABILITY: Generates final release notes & bundles tags on GitHub
  # =========================================================================
  create-release:
    name: create immutable GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-packages
          path: release-assets/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: release-assets/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-metadata
          path: release-assets/attestations

      - name: Create GitHub Release (immutable)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/SHA256SUMS
            release-assets/dist/*
            release-assets/attestations/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
