name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

env:
  PACKAGE_NAME: adsorpy

jobs:
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      match: ${{ steps.semver.outputs.match }}
    steps:
     - name: Checkout repository
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
         fetch-depth: 0

     - name: regex semver tag check
       id: semver
       run: |
        set -euo pipefail
        REF="${GITHUB_REF_NAME}"
        if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?(\+.+)?$ ]]; then
          echo "match=true" >> $GITHUB_OUTPUT
        else
          echo "match=false" >> $GITHUB_OUTPUT
        fi

  # =========================================================================
  # 1. MATRIX COMPILATION: Builds binary wheel variations
  # =========================================================================
  build_wheels:
    needs: tag-check
    if: needs.tag-check.outputs.match == 'true'
    name: Build wheels on ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
        # Linux 64-bit
        - os: ubuntu-latest
          arch: x86_64
          cibw_arch: x86_64
          hatch_plat: linux-x86_64
        # macOS Universal (Intel + Apple Silicon)
        - os: macos-latest
          arch: universal2
          cibw_arch: universal2
          hatch_plat: macosx-10_9-universal2
        # Separate Windows 64-bit
        - os: windows-latest
          arch: AMD64
          msvc_arch: x64
          cibw_arch: AMD64
          hatch_plat: win-amd64
        # Separate Windows 32-bit
        - os: windows-latest
          arch: x86
          msvc_arch: x86
          cibw_arch: x86
          hatch_plat: win32

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build wheels via cibuildwheel ${{ matrix.os }}-${{ matrix.msvc_arch }}
        run: uvx cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: ${{ runner.os == 'Linux' && matrix.cibw_arch || 'auto' }}
          CIBW_ARCHS_MACOS: ${{ runner.os == 'macOS' && matrix.cibw_arch || 'auto' }}
          CIBW_ARCHS_WINDOWS: ${{ runner.os == 'Windows' && matrix.cibw_arch || 'auto' }}
          CIBW_BEFORE_BUILD_WINDOWS: "if exist build rmdir /s /q build && if exist src\\adsorpy del /f /q src\\adsorpy\\*.pyd src\\adsorpy\\*.pyd.png src\\adsorpy\\*.exp src\\adsorpy\\*.lib"
          CIBW_TEST_SKIP: "*-win_arm64"
          SOURCE_DATE_EPOCH: "0"
          PYTHONHASHSEED: "0"
          CIBW_ENVIRONMENT_WINDOWS: >
            DISTUTILS_USE_SDK=1
            MSSdk=1
            _PYTHON_HOST_PLATFORM="${{ matrix.hatch_plat }}"

      - name: Upload OS-specific wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cython-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  # =========================================================================
  # 2. SOURCE & AGGREGATION: Collects wheels, generates sdist, runs validations
  # =========================================================================
  build:
    needs: [tag-check, build_wheels]
    name: build + reproducible artifacts
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    permissions:
      contents: read
      id-token: write      # Required for native OIDC token generation
      attestations: write  # Required for generating native GitHub Attestations

    env:
      SOURCE_DATE_EPOCH: "0"
      PYTHONHASHSEED: "0"
      UV_FROZEN: "1"

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}

      - name: Generate SBOM
        uses: sbomify/sbomify-action@ed3f547023f5a3cc82025a85f568f6baff4bda3f # v26.8.0
        env:
          LOCK_FILE: uv.lock
          OUTPUT_FILE: sbom.cdx.json
          UPLOAD: true
          COMPONENT_ID: "fnTHXhhCGZKB"
          COMPONENT_NAME: ${{ env.PACKAGE_NAME }}
          COMPONENT_VERSION: ${{ github.ref_name }}
          ENRICH: true
          AUGMENT: true

      - name: Install build and validation tools
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev-misc --no-default-groups

      - name: Create working dist directory
        run: mkdir dist

      - name: Download all compiled matrix wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cython-wheels-*
          path: dist
          merge-multiple: true

      - name: Inject populated SBOM into wheels
        run: |
          set -euo pipefail
          for whl in dist/*.whl; do
            echo "Processing $whl..."
            dist_info_dir=$(unzip -Z1 "$whl" | grep '\.dist-info' | head -n 1 | sed -E 's|^([^/\\]+\.dist-info).*|\1/|')
            staging_path="tmp_stage/${dist_info_dir}sboms"
            mkdir -p "$staging_path"
            cp sbom.cdx.json "$staging_path/"
            (cd tmp_stage && zip -g "../$whl" "${dist_info_dir}sboms/sbom.cdx.json")
            rm -rf tmp_stage/
          done

      - name: Build sdist #1
        run: |
          set -euo pipefail
          mkdir sdist1 sdist2
          uv run python -m build --sdist --outdir sdist1

      - name: Build sdist #2 (candidate reproducible)
        run: |
          set -euo pipefail
          uv run python -m build --sdist --outdir sdist2

      - name: Compare builds
        run: |
          set -euo pipefail
          rm -rf reproducibility
          mkdir reproducibility
          sha256sum sdist1/*.tar.gz | awk '{print $1}' > reproducibility/hashes1.txt
          sha256sum sdist2/*.tar.gz | awk '{print $1}' > reproducibility/hashes2.txt
          diff reproducibility/hashes1.txt reproducibility/hashes2.txt
          echo "Reproducible sdist build OK"

      - name: Promote sdist to main dist archive
        run: |
          set -euo pipefail
          mv sdist2/*.tar.gz dist/

      # ---------------------------------------------------------------------
      # VALIDATION ON PURE ARTIFACTS (Twine will crash if bundle.sbom.jsonl is here)
      # ---------------------------------------------------------------------
      - name: Twine check
        run: |
          set -euo pipefail
          uv run python -m twine check dist/*

      - name: Check wheel contents
        run: |
          set -euo pipefail
          uv tool run check-wheel-contents dist/*.whl

      - name: Smoke test (wheels across all target Python versions)
        run: |
          set -euo pipefail
          TARGET_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          for py_ver in "${TARGET_VERSIONS[@]}"; do
            echo "=========================================================="
            echo " Testing Wheel Installation for Python $py_ver"
            echo "=========================================================="
            env_dir="venv_test_${py_ver//./_}"
            uv venv "$env_dir" --python "$py_ver"
            tag_version="cp${py_ver//./}"
            WHEEL_FILE=$(find dist -maxdepth 1 -name "*${tag_version}*manylinux*.whl" | head -n 1)
            if [ -z "$WHEEL_FILE" ]; then
               echo "⚠️ No local manylinux wheel found for $tag_version. Falling back to general search."
               WHEEL_FILE=$(find dist -maxdepth 1 -name "*${tag_version}*linux*.whl" | head -n 1)
            fi
            echo "Installing explicit local file: $WHEEL_FILE"
            uv pip install --python "$env_dir" --force-reinstall "$WHEEL_FILE"
            uv run --no-project --python "$env_dir" python -c "import adsorpy; print('Successfully verified version:', adsorpy.__version__)"
          done

      - name: Smoke test (sdist across all target Python versions)
        run: |
          set -euo pipefail
          TARGET_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          SDIST_FILE=$(find dist -maxdepth 1 -name "*.tar.gz" | head -n 1)
          if [ -z "$SDIST_FILE" ]; then
            echo "❌ Error: Source distribution (.tar.gz) not found in dist/"
            exit 1
          fi
          for py_ver in "${TARGET_VERSIONS[@]}"; do
            echo "=========================================================="
            echo " Testing Source Distribution (sdist) for Python $py_ver"
            echo "=========================================================="

            sdist_env_dir="venv_sdist_${py_ver//./_}"
            uv venv "$sdist_env_dir" --python "$py_ver"
            uv pip install --python "$sdist_env_dir" --force-reinstall "$SDIST_FILE"

            uv run --no-project --python "$sdist_env_dir" python -c "import adsorpy; print('Successfully verified sdist version:', adsorpy.__version__)"
          done

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          uv run --no-project --python venv_test_3_13 python - <<EOF
          import re
          import sys
          from packaging.version import Version
          import adsorpy
          expected_raw = "${GITHUB_REF_NAME}"
          actual = Version(adsorpy.__version__)
          expected_clean = re.sub(r"^v", "", expected_raw)
          expected_clean = expected_clean.replace("-alpha.", "a").replace("-beta.", "b").replace("-rc.", "rc")
          expected_clean = re.sub(r"\+.*$", "", expected_clean)
          expected = Version(expected_clean)
          if actual != expected:
              print(f"❌ Version mismatch! Environment code: {actual} | Target Tag: {expected} (parsed from {expected_raw})")
              sys.exit(1)
          print(f"✅ Version Match Success: {actual}")
          EOF

      # ---------------------------------------------------------------------
      # CRYPTOGRAPHIC TRANSCRIPT HASHES & ATTESTATION BUNDLE GENERATION
      # ---------------------------------------------------------------------
      - name: Generate base64 subject hashes
        id: hash
        run: |
          set -euo pipefail
          HASHES=$(sha256sum dist/*.whl dist/*.tar.gz | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Generate native GitHub Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
          sbom-path: 'sbom.cdx.json'

      - name: Generate final hashes.txt
        run: |
          set -euo pipefail

          # 2. Extract the actual file path generated by the action out of its step outputs
          ATT_BUNDLE="${{ steps.sign_artifacts.outputs.bundle-path }}"

          # 3. Copy the bundle file directly into your dist folder so it gets caught by upload-artifact
          cp "$ATT_BUNDLE" dist/bundle.sbom.jsonl

          # 4. Generate the final verified release hashes manifest file
          sha256sum dist/*.whl dist/*.tar.gz dist/bundle.sbom.jsonl > hashes.txt

      # ---------------------------------------------------------------------
      # UPLOAD STAGING ENVIRONMENT ARTIFACTS
      # ---------------------------------------------------------------------
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            hashes.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  # =========================================================================
  # 3. STAGING DEPLOYMENT: Submits targets to TestPyPI
  # =========================================================================
  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Show hashes (pre-publish verification)
        run: cat hashes.txt

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://pypi.org
          print-hash: true
          attestations: true

  # =========================================================================
  # 4. INTEGRATION LIVE TEST: Installs and verifies straight from TestPyPI simple indices
  # =========================================================================
  verify-install:
    name: verify install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Normalize version
        id: normalize_version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION/-alpha./a}"
          VERSION="${VERSION/-beta./b}"
          VERSION="${VERSION/-rc./rc}"
          VERSION=$(echo "$VERSION" | sed 's/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for TestPyPI index to update
        run: sleep 60

      - name: Install from TestPyPI
        run: |
          set -euo pipefail
          uv run --no-project pip install \
            --index-url https://pypi.org \
            --extra-index-url https://pypi.org \
            ${{ env.PACKAGE_NAME }}==${{ steps.normalize_version.outputs.version }}
          uv run --no-project python -c "import ${{ env.PACKAGE_NAME }}; print(${{ env.PACKAGE_NAME }}.__version__)"

      - name: Verify import outside project tree
        run: |
          set -euo pipefail
          mkdir /tmp/testimport
          cd /tmp/testimport
          uv run --no-project python -c "import ${{ env.PACKAGE_NAME }}; print('Import OK')"

  # =========================================================================
  # 5. PRODUCTION DEPLOYMENT: Pushes definitive distributions to live PyPI registry
  # =========================================================================
  publish:
    name: publish to PyPI
    needs: verify-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Verify hashes before publish
        run: |
          set -euo pipefail
          grep -E '\.(whl|tar\.gz)$' hashes.txt | sha256sum -c -

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  # =========================================================================
  # 6. POST-RELEASE IMMUTABILITY: Generates final release notes & bundles tags on GitHub
  # =========================================================================
  create-release:
    name: create immutable GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: release-assets/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release-assets/

      - name: Create GitHub Release (immutable)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
