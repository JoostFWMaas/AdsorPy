name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Weekly schedule to automatically catch upstream breaking changes
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC

  push:
    branches-ignore: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "images/**"

permissions: {}

jobs:
  test:
    name: Python Tests
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [
          ubuntu-latest,
          macos-latest,
          windows-latest,
        ]
        python-version: [
          '3.11',
          '3.12',
          '3.13',
          '3.14',
        ]
        # Default behaviour uses the standard frozen lockfile
        resolution-strategy: [ default ]

        include:
          # Test absolute lowest bounds (Ubuntu, standard Python version)
          - os: ubuntu-latest
            python-version: '3.13'
            resolution-strategy: lowest
          # Test latest available package upgrades on PyPI
          - os: ubuntu-latest
            python-version: '3.13'
            resolution-strategy: latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: "uv.lock"
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution-strategy }}

      - name: Force Lowest Resolution Bounds
        if: matrix.resolution-strategy == 'lowest'
        run: uv lock --resolution=lowest

      - name: Force Latest Package Upgrades
        if: matrix.resolution-strategy == 'latest'
        run: uv lock --upgrade

      - name: Install tox and plugins
        run: |
          if [ "${{ matrix.resolution-strategy }}" = "default" ]; then
            uv sync --frozen --group envs --no-default-groups
          else
            uv sync --group envs --no-default-groups
          fi
        shell: bash

      - name: Install System Headless Graphics Libraries
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: timeout
          command: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libgl1

      - name: Run static checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.resolution-strategy == 'default'
        env:
          QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || '' }}
        run: uv run tox -m static

      - name: Run tests with tox
        env:
          QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || '' }}
        run: uv run tox -e py$(echo "${{ matrix.python-version }}" | tr -d '.')

      - name: Upload coverage data fragment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.resolution-strategy }}
          path: .coverage.*
          include-hidden-files: true

      - name: Upload test results
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && matrix.resolution-strategy == 'default'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-results
          path: results.xml

#      - name: Upload coverage reports to Codecov
#        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && matrix.resolution-strategy == 'default'
#        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
#        with:
#          token: ${{ secrets.GIST_SECRET }}

  coverage-report:
    name: Merge & Report Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: "uv.lock"

      - name: Install dependencies
        run: uv sync --group envs --no-default-groups

      # Downloads ALL previously uploaded fragments into the root folder
      - name: Download all coverage data fragments
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      # Combines files and prints summary report via tox
      - name: Merge and report coverage
        run: uv run tox -e coverage

      - name: Upload final coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.GIST_SECRET }}
          files: .coverage

  ci-success:
    permissions: {}
    name: CI
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - run: echo "All matrix tests passed"
