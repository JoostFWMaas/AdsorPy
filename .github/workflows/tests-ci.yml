name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Weekly schedule to automatically catch upstream breaking changes
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC

  push:
    branches-ignore: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "images/**"

permissions: {}

jobs:
  test:
    name: Python Tests
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [
          ubuntu-latest,
          macos-latest,
          windows-latest,
        ]
        python-version: [
          '3.10',
          '3.11',
          '3.12',
          '3.13',
          '3.14',
        ]
        # Default behaviour uses the standard frozen lockfile
        resolution-strategy: [ default ]

        include:
          # Test absolute lowest bounds (Ubuntu, standard Python version)
          - os: ubuntu-latest
            python-version: '3.13'
            resolution-strategy: lowest
          # Test latest available package upgrades on PyPI
          - os: ubuntu-latest
            python-version: '3.13'
            resolution-strategy: latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.resolution-strategy }}

      - name: Force Lowest Resolution Bounds
        if: matrix.resolution-strategy == 'lowest'
        run: uv lock --resolution=lowest

      - name: Force Latest Package Upgrades
        if: matrix.resolution-strategy == 'latest'
        run: uv lock --upgrade

      - name: Install tox and plugins
        run: |
          if [ "${{ matrix.resolution-strategy }}" = "default" ]; then
            uv sync --frozen --extra envs --no-default-groups
          else
            uv sync --extra envs --no-default-groups
          fi
        shell: bash

      - name: Install System Headless Graphics Libraries
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: timeout
          command: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libgl1

      - name: Run static checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.resolution-strategy == 'default'
        env:
          QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || '' }}
        run: uv run tox -m static

      - name: Run tests with tox
        env:
          QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || '' }}
        run: uv run tox -e py$(echo "${{ matrix.python-version }}" | tr -d '.')

      - name: Upload test results
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && matrix.resolution-strategy == 'default'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results
          path: results.xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && matrix.resolution-strategy == 'default'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.GIST_SECRET }}

  ci-success:
    permissions: {}
    name: CI
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - run: echo "All matrix tests passed"
