# Coordinated Dependabot configuration file for Python (pip & uv) and GitHub Actions.
# Reference documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ---------- Python Fast Package Ecosystem (uv) ----------------
  - package-ecosystem: "uv"
    directory: "/" # Will look for the uv.lock file.
    schedule:
        interval: "cron"
        cronjob: "0 4 * * 2" # Every Tuesday at 04:00 UTC

    groups:
      python-dependencies:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --------- CI/CD Workflows Ecosystem (GitHub Actions) --------------
  - package-ecosystem: "github-actions"
    directory: "/" # Resolves automatically to standard path: /.github/workflows
    schedule:
        interval: "cron"
        cronjob: "0 4 * * 2" # Every Tuesday at 04:00 UTC

    groups:
      action-dependencies:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
