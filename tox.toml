min_version = "4.65.5"
env_list = [{ prefix = "py3", start = 10, stop = 14 }, "ruff", "mypy", "basedpyright", "tach", "slotscheck"]
isolated_build = true
recreate = true
labels = {static = ["ruff", "mypy", "basedpyright", "tach", "slotscheck"] }


# Quick reference: for all tests in clean environments, ``tox run -r``
# For linting only: ``run -m static -r``
# For a single env, such as py310: ``tox run -e py310 -r``
# To run in parallel: ``tox -p -r``
[env_run_base]
runner = "uv-venv-lock-runner"
pass_env = [
    "CI",
    "GITHUB_*",
    "CODECOV_*",
    "QT_QPA_PLATFORM",
    "QT_XCB_GL_INTEGRATION",
]
dependency_groups = ["test", "dev-gui"]
commands = [["pytest", "--cov=adsorpy", "--basetemp={envtmpdir}", "--cov-report=term", "--junitxml=results.xml"],
    [{ replace = "if", condition = "factor.py314", then = ["codecov"], extend = true }],
]

[env.ruff]
no_default_groups = true
dependency_groups = ["lint"]
commands = [["ruff", "check", "src", "tests"]]

[env.mypy]
#skip_install = true
dependency_groups = ["lint", "test", "dev-gui"]
commands = [["mypy", "src", "tests"],
]

[env.basedpyright]
dependency_groups  = ["lint", "test", "dev-gui"]
commands = [["basedpyright", "--venvpath", "{envdir}"]]

[env.slotscheck]
dependency_groups = ["lint", "dev-gui", "test"]
commands = [["slotscheck", "-m", "adsorpy", "-v"]]

[env.tach]
dependency_groups = ["lint"]
commands = [["tach", "check"]]
