min_version = "4.61.4"
env_list = [{ prefix = "py3", start = 10, stop = 14 }, "coverage-report", "ruff", "mypy", "basedpyright", "tach", "slotscheck"]
isolated_build = true
recreate = true
labels = {static = ["ruff", "mypy", "basedpyright", "tach", "slotscheck"] }


# Quick reference: for all tests in clean environments, ``tox run -r``
# For linting only: ``run -m static -r``
# For a single env, such as py310: ``tox run -e py310 -r``
# To run in parallel: ``tox -p``
[env_run_base]
runner = "uv-venv-lock-runner"
set_env = { "COVERAGE_FILE" = "{tox_root}/.coverage" }
pass_env = [
    "CI",
    "GITHUB_*",
    "CODECOV_*",
    "QT_QPA_PLATFORM",
    "QT_XCB_GL_INTEGRATION",
]
extras = ["test"]
commands = [["coverage", "run", "-p", "-m", "pytest", "--cov=adsorpy", "--basetemp={envtmpdir}", "--cov-report=term", "--junitxml=results.xml"],
    [{ replace = "if", condition = "factor.py314", then = ["codecov"], extend = true }],
]

[env.coverage-report]
depends = ["py3*"]
change_dir = "{tox_root}"
set_env = { "COVERAGE_FILE" = "{tox_root}/.coverage" }
commands = [
    ["coverage", "combine"],
    ["coverage", "report", "-m"],
    ["coverage", "xml"], # Handy for CI tools like Codecov
]

[env.ruff]
skip_install = true
extras = ["lint"]
commands = [["ruff", "check", "src", "tests"]]

[env.mypy]
#skip_install = true
extras = ["lint", "test"]
commands = [["mypy", "src", "tests"],
]

[env.basedpyright]
extras = ["lint", "test"]
commands = [["basedpyright", "--venvpath", "{envdir}"]]

[env.slotscheck]
extras = ["lint", "gui-deps", "test"]
commands = [["slotscheck", "-m", "adsorpy", "-v"]]

[env.tach]
extras = ["lint"]
commands = [["tach", "check"]]
