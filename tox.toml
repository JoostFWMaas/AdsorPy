min_version = "4.64.0"
env_list = [{ prefix = "py3", start = 11, stop = 14 }, "ruff", "mypy", "basedpyright", "tach", "slotscheck"]
labels = {static = ["ruff", "mypy", "basedpyright", "tach", "slotscheck"] }

# Quick reference:
# Run tox: ``tox run``
# For clean environments, ``-r``
# For linting (or another tox group) only: ``-m static``
# For a single env, such as py310: ``-e py310``
# To run in parallel: ``-p``
# To run just 1 file or folder: ``-e py311 -- PATH_GOES_HERE``
[env_run_base]
runner = "uv-venv-lock-runner"
pass_env = [
    "CI",
    "GITHUB_*",
    "CODECOV_*",
    "QT_QPA_PLATFORM",
    "QT_XCB_GL_INTEGRATION",
]
dependency_groups = ["test", "dev-gui"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }, "--cov=adsorpy", "--basetemp={envtmpdir}", "--cov-report=term", "--junitxml=results.xml"],
    [{ replace = "if", condition = "factor.py314", then = ["codecov"], extend = true }],
]

[env.ruff]
no_default_groups = true
dependency_groups = ["lint"]
commands = [["ruff", "check", "src", "tests"]]

[env.mypy]
#skip_install = true
dependency_groups = ["lint", "test", "dev-gui"]
commands = [["mypy", "src", "tests"],
]

[env.basedpyright]
dependency_groups  = ["lint", "test", "dev-gui"]
commands = [["basedpyright", "--venvpath", "{envdir}"]]

[env.slotscheck]
dependency_groups = ["lint", "dev-gui", "test"]
commands = [["slotscheck", "-m", "adsorpy", "-v"]]

[env.tach]
dependency_groups = ["lint"]
commands = [["tach", "check"]]
