min_version = "4.67.13"
env_list = [{ prefix = "py3", start = 11, stop = 14 }, "ruff", "mypy", "basedpyright", "tach", "slotscheck", "coverage"]
labels = {static = ["ruff", "mypy", "basedpyright", "tach", "slotscheck"], test=[{ prefix = "py3", start = 11, stop = 14 }, "coverage"] }

# Quick reference:
# Run tox: ``tox run``
# For clean environments, ``-r``
# For linting (or another tox label group) only: ``-m static``
# For a single env, such as py314: ``-e py314``
# To run in parallel: ``-p``
# To run just 1 file or folder: ``-e py311 -- PATH_GOES_HERE``
[env_run_base]
runner = "uv-venv-lock-runner"
pass_env = [
    "CI",
    "GITHUB_*",
    "CODECOV_*",
    "QT_QPA_PLATFORM",
    "QT_XCB_GL_INTEGRATION",
]
dependency_groups = ["test", "dev-gui"]
commands = [["coverage", "run", "--branch", "-p", "-m", "pytest", "--basetemp={env_tmp_dir}", { replace = "posargs", default = ["tests"], extend = true }],
#commands = [
#    ["pytest", "--cov=adsorpy", "--cov-report=", "--cov-config=pyproject.toml", { replace = "posargs", default = ["tests"], extend = true }],
    [{ replace = "if", condition = "factor.py314", then = ["codecov"], extend = true }],
]

[env.ruff]
no_default_groups = true
dependency_groups = ["lint"]
commands = [["ruff", "check", "src", "tests"],
]

[env.mypy]
dependency_groups = ["lint", "test", "dev-gui"]
commands = [["mypy", "src", "tests"],
]

[env.basedpyright]
dependency_groups  = ["lint", "test", "dev-gui"]
commands = [["basedpyright", "--venvpath", "{envdir}"]]

[env.slotscheck]
dependency_groups = ["lint", "dev-gui", "test"]
commands = [["slotscheck", "-m", "adsorpy", "-v"]]

[env.tach]
dependency_groups = ["lint"]
commands = [["tach", "check"]]

[env.coverage]
skip_install = true
depends = ["py3*"]
dependency_groups = ["test"]
# Runs 'coverage combine' to merge all .coverage.* files into one '.coverage' file,
# then outputs the final terminal summary and generates a combined report.
commands = [
    ["coverage", "combine"],
    ["coverage", "report", "-m"],
    ["coverage", "html"]
]
