min_version = "4.60.1"
env_list = [{ prefix = "py3", start = 10, stop = 14 }, "ruff", "mypy", "basedpyright", "tach", "slotscheck"]
isolated_build = true
recreate = true
labels = {static = ["ruff", "mypy", "basedpyright", "tach", "slotscheck"] }


# Quick reference: for all tests in clean environments, ``uvx tox run -r``
# For linting only: ``uvx tox run -m static -r``
[env_run_base]
labels = ["test"]
pass_env = [
    "CI",
    "GITHUB_*",
    "CODECOV_*",
    "QT_QPA_PLATFORM",
    "QT_XCB_GL_INTEGRATION",
]
deps = ["-e .[test]"]
commands = [["pytest", "--cov=adsorpy", "--basetemp={envtmpdir}", "--cov-report=term", "--junitxml=results.xml"],
    [{ replace = "if", condition = "factor.py314", then = ["codecov"], extend = true }],
]

[env.ruff]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", "src", "tests"]]

[env.mypy]
#skip_install = true
deps = ["mypy", "[test]"]
commands = [["mypy", "--strict", "--ignore-missing-imports", "--disallow-any-explicit", "--allow-untyped-decorators", "--allow-subclassing-any", "--exclude", "/scripts/", "src", "tests", "--native-parser", "--show-error-end", "--show-error-code-links", "--show-error-context", "--enable-error-code", "exhaustive-match"],
]

[env.basedpyright]
deps = ["basedpyright", "[test]"]
commands = [["basedpyright", "--venvpath", "{envdir}"]]

[env.slotscheck]
deps = ["slotscheck", "[gui-deps]"]
commands = [["python", "-m", "slotscheck", "-m", "adsorpy"]]

[env.tach]
skip_install = true
deps = ["tach"]
commands = [["tach", "check"]]
